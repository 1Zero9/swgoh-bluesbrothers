[project]
name = "blues-brothers-droid"
version = "0.1.0"
description = "Free Discord reports for the Blues Brothers SWGOH guild"
requires-python = ">=3.11"

[project.scripts]
guild-report = "guild_droid.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
